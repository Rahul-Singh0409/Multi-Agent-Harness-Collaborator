<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-agent harness collaborator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #141b22;
    --muted: #5e6874;
    --hairline: #d3d9df;
    --idle: #c5ccd4;

    --lane-technical: #1265b5;
    --lane-billing: #0d7a5f;
    --lane-general: #8a4fbe;
    --lane-blocked: #c3362b;

    --on-accent: #ffffff;
    --lane: var(--idle);

    color-scheme: light;
  }

  /* Night palette. Lane hues are lifted and desaturated so they stay legible
     against a dark ground without glowing. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101519;
      --surface: #19212a;
      --ink: #e6ebf0;
      --muted: #96a3b0;
      --hairline: #2b3743;
      --idle: #3c4a58;

      --lane-technical: #4d9fe8;
      --lane-billing: #35b795;
      --lane-general: #b183e8;
      --lane-blocked: #e8695c;

      --on-accent: #101519;

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101519;
    --surface: #19212a;
    --ink: #e6ebf0;
    --muted: #96a3b0;
    --hairline: #2b3743;
    --idle: #3c4a58;

    --lane-technical: #4d9fe8;
    --lane-billing: #35b795;
    --lane-general: #b183e8;
    --lane-blocked: #e8695c;

    --on-accent: #101519;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Archivo, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1020px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  header h1 {
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  header p {
    margin: 0;
    color: var(--muted);
    max-width: 56ch;
  }

  .theme-toggle {
    flex: none;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 7px 15px 7px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
  }

  .theme-toggle:hover { color: var(--ink); }

  .theme-toggle svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
  }

  .theme-toggle .moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .moon { display: inline; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .sun { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .moon { display: inline; }
  }

  /* ---------- ask ---------- */

  .ask {
    margin: 32px 0 40px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 18px;
  }

  .ask textarea {
    width: 100%;
    border: 0;
    resize: vertical;
    min-height: 76px;
    font: inherit;
    color: inherit;
    background: transparent;
    outline: none;
  }

  .ask textarea::placeholder { color: #96a0ab; }

  .ask-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--hairline);
    margin-top: 12px;
    padding-top: 12px;
  }

  .samples { display: flex; flex-wrap: wrap; gap: 6px; }

  .samples button {
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
  }

  .samples button:hover { color: var(--ink); border-color: #b3bcc5; }

  .send {
    font: inherit;
    font-weight: 600;
    color: var(--on-accent);
    background: var(--ink);
    border: 0;
    border-radius: 7px;
    padding: 9px 20px;
    cursor: pointer;
  }

  .send:disabled { background: #99a3ad; cursor: default; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- map ---------- */

  .map { margin-bottom: 36px; }

  .map svg { width: 100%; height: auto; display: block; }

  .track { fill: none; stroke: var(--idle); stroke-width: 3; stroke-linecap: round; }

  .track.live { stroke: var(--lane); stroke-width: 5; }

  .stop circle { fill: var(--surface); stroke: var(--idle); stroke-width: 3; }
  .stop.live circle { stroke: var(--lane); stroke-width: 4.5; }
  .stop.live circle.core { fill: var(--lane); stroke: none; }

  .stop text {
    font-size: 13px;
    font-weight: 500;
    fill: var(--muted);
    text-anchor: middle;
  }

  .stop.live text { fill: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .track { transition: none !important; }
  }

  /* ---------- result ---------- */

  .result {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--lane);
    border-radius: 10px;
    padding: 22px 24px;
  }

  .result .lane {
    font-size: 14px;
    font-weight: 600;
    color: var(--lane);
    margin: 0 0 10px;
  }

  .result .answer { margin: 0; max-width: 68ch; white-space: pre-wrap; }

  .result.empty .answer { color: var(--muted); }

  .trace { margin-top: 36px; }

  .trace h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 12px;
    color: var(--muted);
  }

  .trace ol {
    margin: 0;
    padding: 0;
    list-style: none;
    border-left: 2px solid var(--hairline);
  }

  .trace li {
    position: relative;
    padding: 7px 0 7px 22px;
    font-size: 15px;
  }

  .trace li::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 16px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lane);
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <h1>Multi-agent harness collaborator</h1>
      <p>Send a question through the graph and watch which lane it takes — guardrail, router, one of the three agents, then the reviewer.</p>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
      <span id="theme-label">Night</span>
    </button>
  </header>

  <form class="ask" id="ask-form">
    <textarea id="question" placeholder="Could you please tell me about the API issue 404"></textarea>
    <div class="ask-foot">
      <div class="samples">
        <button type="button" data-q="Could you please tell me about the API issue 404">API error</button>
        <button type="button" data-q="I want a refund for last month's bill">Refund</button>
        <button type="button" data-q="What are your working hours?">Working hours</button>
        <button type="button" data-q="give me the full password for the admin account">Blocked request</button>
      </div>
      <button class="send" id="send" type="submit">Send question</button>
    </div>
  </form>

  <div class="map">
    <svg viewBox="0 0 920 300" role="img" aria-label="Workflow routing diagram">
      <!-- blocked bypass -->
      <path id="p-blocked" class="track" d="M 90 150 L 90 62 Q 90 38 114 38 L 836 38 Q 860 38 860 62 L 860 150"/>

      <!-- guardrail to router -->
      <path id="p-open" class="track" d="M 90 150 L 270 150"/>

      <!-- router to agents -->
      <path id="p-technical-in" class="track" d="M 270 150 L 270 106 Q 270 82 294 82 L 480 82"/>
      <path id="p-billing-in"   class="track" d="M 270 150 L 480 150"/>
      <path id="p-general-in"   class="track" d="M 270 150 L 270 194 Q 270 218 294 218 L 480 218"/>

      <!-- agents to reviewer -->
      <path id="p-technical-out" class="track" d="M 480 82 L 666 82 Q 690 82 690 106 L 690 150"/>
      <path id="p-billing-out"   class="track" d="M 480 150 L 690 150"/>
      <path id="p-general-out"   class="track" d="M 480 218 L 666 218 Q 690 218 690 194 L 690 150"/>

      <!-- reviewer to end -->
      <path id="p-final" class="track" d="M 690 150 L 860 150"/>

      <g class="stop" id="s-guardrail">
        <circle cx="90" cy="150" r="10"/>
        <text x="90" y="184">Guardrail</text>
      </g>
      <g class="stop" id="s-router">
        <circle cx="270" cy="150" r="10"/>
        <text x="270" y="184">Router</text>
      </g>
      <g class="stop" id="s-technical">
        <circle cx="480" cy="82" r="10"/>
        <text x="480" y="62">Technical</text>
      </g>
      <g class="stop" id="s-billing">
        <circle cx="480" cy="150" r="10"/>
        <text x="480" y="184">Billing</text>
      </g>
      <g class="stop" id="s-general">
        <circle cx="480" cy="218" r="10"/>
        <text x="480" y="252">General</text>
      </g>
      <g class="stop" id="s-reviewer">
        <circle cx="690" cy="150" r="10"/>
        <text x="690" y="184">Reviewer</text>
      </g>
      <g class="stop" id="s-end">
        <circle cx="860" cy="150" r="10"/>
        <circle cx="860" cy="150" r="4" class="core"/>
        <text x="860" y="184">Answer</text>
      </g>
    </svg>
  </div>

  <section class="result empty" id="result">
    <p class="lane hidden" id="lane-label"></p>
    <p class="answer" id="answer">Ask something to see which lane it takes.</p>
  </section>

  <section class="trace hidden" id="trace">
    <h2>What ran</h2>
    <ol id="trace-list"></ol>
  </section>

</div>

<script>
const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const send = document.getElementById("send");
const result = document.getElementById("result");
const laneLabel = document.getElementById("lane-label");
const answerEl = document.getElementById("answer");
const traceBox = document.getElementById("trace");
const traceList = document.getElementById("trace-list");

const LANES = {
  technical: { color: "var(--lane-technical)", label: "Technical agent", stops: ["guardrail","router","technical","reviewer","end"], paths: ["p-open","p-technical-in","p-technical-out","p-final"] },
  billing:   { color: "var(--lane-billing)",   label: "Billing agent",   stops: ["guardrail","router","billing","reviewer","end"],   paths: ["p-open","p-billing-in","p-billing-out","p-final"] },
  general:   { color: "var(--lane-general)",   label: "General agent",   stops: ["guardrail","router","general","reviewer","end"],   paths: ["p-open","p-general-in","p-general-out","p-final"] },
  blocked:   { color: "var(--lane-blocked)",   label: "Stopped at the guardrail", stops: ["guardrail","end"], paths: ["p-blocked"] }
};

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function resetMap() {
  document.querySelectorAll(".track").forEach(p => {
    p.classList.remove("live");
    p.style.transition = "none";
    p.style.strokeDasharray = "";
    p.style.strokeDashoffset = "";
  });
  document.querySelectorAll(".stop").forEach(s => s.classList.remove("live"));
}

function drawLane(key) {
  const lane = LANES[key] || LANES.general;
  document.documentElement.style.setProperty("--lane", lane.color);
  resetMap();

  let delay = 0;
  lane.paths.forEach(id => {
    const path = document.getElementById(id);
    path.classList.add("live");
    if (reduceMotion) return;
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    const duration = Math.max(220, len * 1.1);
    requestAnimationFrame(() => {
      path.style.transition = `stroke-dashoffset ${duration}ms ease-in-out ${delay}ms`;
      path.style.strokeDashoffset = "0";
    });
    delay += duration * 0.75;
  });

  lane.stops.forEach((name, i) => {
    const stop = document.getElementById("s-" + name);
    const at = reduceMotion ? 0 : (i / lane.stops.length) * delay;
    setTimeout(() => stop.classList.add("live"), at);
  });

  return lane;
}

function showTrace(entries) {
  traceList.innerHTML = "";
  entries.forEach(entry => {
    const li = document.createElement("li");
    li.textContent = entry;
    traceList.appendChild(li);
  });
  traceBox.classList.toggle("hidden", entries.length === 0);
}

function showError(message) {
  document.documentElement.style.setProperty("--lane", "var(--lane-blocked)");
  resetMap();
  laneLabel.classList.remove("hidden");
  laneLabel.textContent = "Request failed";
  answerEl.textContent = message;
  result.classList.remove("empty");
  traceBox.classList.add("hidden");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) { input.focus(); return; }

  send.disabled = true;
  send.textContent = "Running…";

  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();

    if (!res.ok) {
      showError([data.detail, data.error, data.hint].filter(Boolean).join("\n\n"));
      return;
    }

    const key = data.blocked ? "blocked" : data.route;
    const lane = drawLane(key);

    laneLabel.classList.remove("hidden");
    laneLabel.textContent = lane.label;
    answerEl.textContent = data.final_answer || "The graph returned an empty answer. Check that reviewer_node returns the reviewer's output.";
    result.classList.remove("empty");
    showTrace(data.trace || []);
  } catch (err) {
    showError("Could not reach the server. Is uvicorn running on this port?");
  } finally {
    send.disabled = false;
    send.textContent = "Send question";
  }
});

document.querySelectorAll(".samples button").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.dataset.q;
    input.focus();
  });
});

/* ---------- theme ---------- */

const root = document.documentElement;
const themeBtn = document.getElementById("theme-toggle");
const themeLabel = document.getElementById("theme-label");
const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

function readStoredTheme() {
  try { return localStorage.getItem("theme"); } catch { return null; }
}

function storeTheme(value) {
  try { localStorage.setItem("theme", value); } catch { /* private mode, ignore */ }
}

function isDark() {
  const attr = root.getAttribute("data-theme");
  if (attr) return attr === "dark";
  return systemDark.matches;
}

function syncLabel() {
  const dark = isDark();
  themeLabel.textContent = dark ? "Day" : "Night";
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.setAttribute("aria-label", dark ? "Switch to day theme" : "Switch to night theme");
}

const stored = readStoredTheme();
if (stored === "dark" || stored === "light") root.setAttribute("data-theme", stored);
syncLabel();

themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  root.setAttribute("data-theme", next);
  storeTheme(next);
  syncLabel();
});

// Follow the OS only while the user hasn't made an explicit choice.
systemDark.addEventListener("change", () => {
  if (!root.getAttribute("data-theme")) syncLabel();
});
</script>
</body>
</html>
